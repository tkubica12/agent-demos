[project]
name = "autopilots-on-azure"
version = "0.1.0"
description = "Hermes digital workers on Azure Container Apps Sandboxes."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "azure-ai-projects>=2.3.0",
    "azure-containerapps-sandbox==0.1.0b4",
    "azure-identity>=1.25.0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b0",
    "azure-servicebus>=7.14.2",
    "cryptography>=43.0.0",
    "fastapi>=0.115.13",
    "httpx==0.28.1",
    "mcp>=1.23.0,<3",
    "microsoft-agents-a365-notifications==1.0.0",
    "microsoft-agents-authentication-msal>=1.1.0",
    "microsoft-agents-hosting-fastapi>=1.1.0",
    "opentelemetry-sdk>=1.30.0",
    "PyJWT[crypto]==2.13.0",
    "uvicorn[standard]>=0.34.3",
]

[tool.uv]
prerelease = "if-necessary"
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "protected-pypi"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true
