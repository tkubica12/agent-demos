<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Hermes on Azure architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#505050"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>

  <g stroke="#505050" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M210,72 H248"/>
    <path d="M440,72 H585 V138"/>
    <path d="M210,282 H460 V196 H478"/>
    <path d="M585,226 V328" marker-start="url(#arrow)"/>
    <path d="M680,182 H738"/>
    <path d="M850,130 V86"/>
    <path d="M850,312 V358"/>
    <path d="M740,292 H712 V362 H682"/>
  </g>

  <g font-size="12" fill="#404040">
    <text x="595" y="64">/api/messages</text>
    <text x="300" y="274">/invoke</text>
    <text x="595" y="282">scheduled jobs</text>
    <text x="686" y="174">invoke</text>
    <text x="860" y="113">Entra</text>
    <text x="860" y="340">Worker tokens</text>
    <text x="704" y="318" text-anchor="end">next run</text>
  </g>

  <g>
    <rect x="20" y="40" width="190" height="64" rx="8" fill="#f1ebfa" stroke="#6b3fa0" stroke-width="1.5"/>
    <text x="115" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#2b1a40">Teams and Outlook</text>
    <text x="115" y="88" text-anchor="middle" font-size="12" fill="#404040">people</text>

    <rect x="250" y="40" width="190" height="64" rx="8" fill="#f1ebfa" stroke="#6b3fa0" stroke-width="1.5"/>
    <text x="345" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#2b1a40">Agent 365</text>
    <text x="345" y="88" text-anchor="middle" font-size="12" fill="#404040">Agent User identity</text>

    <rect x="20" y="250" width="190" height="64" rx="8" fill="#f3f3f3" stroke="#616161" stroke-width="1.5"/>
    <text x="115" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#202020">Operator scripts</text>
    <text x="115" y="298" text-anchor="middle" font-size="12" fill="#404040">deploy, smoke, review</text>

    <rect x="480" y="140" width="200" height="86" rx="8" fill="#e8f1fb" stroke="#0f6cbd" stroke-width="1.5"/>
    <text x="580" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#0b3a66">gateway Sandbox</text>
    <text x="580" y="194" text-anchor="middle" font-size="12" fill="#404040">always on</text>
    <text x="580" y="211" text-anchor="middle" font-size="12" fill="#404040">Teams delivery, lifecycle</text>

    <rect x="480" y="330" width="200" height="64" rx="8" fill="#fff4e5" stroke="#c25e00" stroke-width="1.5"/>
    <text x="580" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#5a2c00">Service Bus</text>
    <text x="580" y="378" text-anchor="middle" font-size="12" fill="#404040">per-Worker queue</text>

    <rect x="740" y="20" width="200" height="64" rx="8" fill="#e8f1fb" stroke="#0f6cbd" stroke-width="1.5"/>
    <text x="840" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#0b3a66">Foundry</text>
    <text x="840" y="68" text-anchor="middle" font-size="12" fill="#404040">gpt-6.1-sol</text>

    <rect x="740" y="130" width="200" height="182" rx="8" fill="#e8f1fb" stroke="#0f6cbd" stroke-width="1.5"/>
    <text x="840" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#0b3a66">Hermes runtime Sandbox</text>
    <rect x="756" y="170" width="168" height="34" rx="6" fill="#ffffff" stroke="#0f6cbd"/>
    <text x="840" y="192" text-anchor="middle" font-size="12" fill="#202020">Hermes 0.19.0</text>
    <rect x="756" y="212" width="168" height="34" rx="6" fill="#ffffff" stroke="#0f6cbd"/>
    <text x="840" y="234" text-anchor="middle" font-size="12" fill="#202020">loopback identity adapter</text>
    <rect x="756" y="254" width="168" height="44" rx="6" fill="#fff4e5" stroke="#c25e00"/>
    <text x="840" y="272" text-anchor="middle" font-size="12" fill="#202020">Data Disk</text>
    <text x="840" y="288" text-anchor="middle" font-size="11" fill="#404040">memory, skills, cron</text>

    <rect x="740" y="360" width="200" height="110" rx="8" fill="#f1ebfa" stroke="#6b3fa0" stroke-width="1.5"/>
    <text x="840" y="388" text-anchor="middle" font-size="14" font-weight="600" fill="#2b1a40">MCP tools</text>
    <text x="840" y="410" text-anchor="middle" font-size="12" fill="#404040">private MCP</text>
    <text x="840" y="428" text-anchor="middle" font-size="12" fill="#404040">public MCP</text>
    <text x="840" y="446" text-anchor="middle" font-size="12" fill="#404040">Work IQ MCP</text>
