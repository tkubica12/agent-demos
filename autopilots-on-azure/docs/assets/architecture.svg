<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Event-driven Hermes Workers on Azure</title>
  <desc>Agent 365, or the Agent Chat Simulator for testing, delivers Teams activities to a thin gateway, which calls native Runs over OnDemand HTTPS. Service Bus carries scheduled work only. The scheduling journal and native runtime home have independent durable backups. Model and tool traffic leaves the runtime directly.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f6cbd"/></marker>
  </defs>
  <rect width="1200" height="670" fill="#fff"/>
  <g fill="#f3f3f3" stroke="#616161" stroke-width="1.3">
    <rect x="320" y="220" width="270" height="190" rx="14" fill="#fff" stroke-dasharray="6 5"/>
    <rect x="920" y="220" width="260" height="190" rx="14" fill="#fff" stroke-dasharray="6 5"/>
    <rect x="40" y="50" width="220" height="100" rx="9"/>
    <rect x="340" y="50" width="230" height="100" rx="9"/>
    <rect x="650" y="50" width="220" height="100" rx="9"/>
    <rect x="940" y="50" width="220" height="100" rx="9"/>
    <rect x="40" y="260" width="220" height="100" rx="9"/>
    <rect x="340" y="250" width="230" height="130" rx="9"/>
    <rect x="940" y="250" width="220" height="130" rx="9"/>
    <rect x="40" y="470" width="220" height="100" rx="9"/>
    <rect x="340" y="470" width="230" height="100" rx="9"/>
    <rect x="650" y="470" width="220" height="100" rx="9"/>
    <rect x="940" y="470" width="220" height="100" rx="9"/>
  </g>
  <g stroke="#0f6cbd" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M260 100H340" stroke-dasharray="5 4"/>
    <path d="M455 150V250" marker-start="url(#arrow)"/>
    <path d="M260 310H340" marker-start="url(#arrow)"/>
    <path d="M570 310H940" marker-start="url(#arrow)"/>
    <path d="M760 150V185H455V250" stroke-dasharray="5 4"/>
    <path d="M760 150V185H1010V250" stroke-dasharray="5 4"/>
    <path d="M940 345H900V520H870"/>
    <path d="M650 520H610V345H570"/>
    <path d="M1050 250V150"/>
    <path d="M455 380V470"/>
    <path d="M1050 380V470"/>
    <path d="M340 355H300V520H260"/>
  </g>
  <g text-anchor="middle" fill="#202020" font-size="17" font-weight="600">
    <text x="150" y="80">Native managed receivers</text>
    <text x="455" y="80">Service Bus</text>
    <text x="760" y="80">Source releases</text>
    <text x="1050" y="80">Foundry + MCP tools</text>
    <text x="150" y="292">Agent 365</text>
    <text x="455" y="284">Thin gateway</text>
    <text x="1050" y="284">Hermes runtime</text>
    <text x="150" y="502">Generated apps</text>
    <text x="455" y="502">Gateway journal</text>
    <text x="760" y="502">Scheduling queue</text>
    <text x="1050" y="502">Native Worker home</text>
  </g>
  <g text-anchor="middle" fill="#404040" font-size="13">
    <text x="150" y="105">Namespace MI owns PeekLock</text>
    <text x="150" y="127">Fixed OnDemand callbacks</text>
    <text x="455" y="105">Scheduled work only</text>
    <text x="455" y="127">No interactive activity queue</text>
    <text x="760" y="105">Verified application archives</text>
    <text x="760" y="127">Pinned dependency bases</text>
    <text x="1050" y="105">Direct Entra-authenticated calls</text>
    <text x="1050" y="127">MI, Agent Identity, Agent User</text>
    <text x="150" y="318">Teams, Outlook, Office events</text>
    <text x="150" y="340">Testing: Agent Chat Simulator</text>
    <text x="455" y="311">Validate, handle, run, deliver</text>
    <text x="455" y="335">No continuous receive loop</text>
    <text x="455" y="359">Pinned base + hashed source release</text>
    <text x="1050" y="311">Hermes 0.22.6 + reviewed role</text>
    <text x="1050" y="335">Native Runs + model/tool loop</text>
    <text x="1050" y="359">Base image + source release</text>
    <text x="150" y="528">Separate authenticated sites</text>
    <text x="150" y="550">Lifecycle via gateway only</text>
    <text x="455" y="528">Scheduling receipts, chat bindings</text>
    <text x="455" y="550">SQLite with Blob checkpoints</text>
    <text x="760" y="528">Cron, Dream, retries</text>
    <text x="760" y="550">Managed wake; native cron state</text>
    <text x="1050" y="528">Memory, skills, history, cron</text>
    <text x="1050" y="550">Native backup archives on Blob</text>
    <text x="755" y="290">Native Runs / OnDemand HTTPS</text>
    <text x="600" y="615">Gateway, runtime, and MCP Sandboxes suspend to Memory after 300 idle seconds; actual transitions are measured.</text>
    <text x="600" y="641">Managed polling is outside the normal chat path. ACR, Service Bus, storage, and monitoring retain their own costs.</text>
  </g>
  <g fill="#404040" font-size="13">
    <text x="768" y="173">deployer only</text>
    <text x="1058" y="205">inference, tools</text>
  </g>
  <g fill="#616161" font-size="11" letter-spacing="0.5">
    <text x="330" y="401">GATEWAY SANDBOX</text>
    <text x="930" y="401">RUNTIME SANDBOX</text>
  </g>
</svg>
