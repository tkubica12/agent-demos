[project]
name = "autopilots-hermes-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "hermes-agent==0.19.0",
    "mcp>=2.1.1,<3",
    "PyYAML>=6.0.3",
    "azure-identity>=1.25.0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b0",
    "azure-servicebus>=7.14.2",
    "aiohttp>=3.14.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.50.0",
    "httpx>=0.28.1",
    "cryptography>=43.0.0",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.4",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pypdf>=6.0.0",
    "pdfplumber>=0.11.7",
    "reportlab>=4.4.3",
    "defusedxml>=0.7.1",
    "lxml>=6.0.0",
    "opentelemetry-sdk>=1.30.0",
]

[tool.uv]
prerelease = "if-necessary"
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "protected-pypi"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true
