[project]
name = "public-shipments-mcp"
version = "0.1.0"
description = "Public shipment tracking MCP server for Agent 365 BYO demonstrations."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp",
    "PyJWT",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["public_shipments_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "protected-pypi"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
