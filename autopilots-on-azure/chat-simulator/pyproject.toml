[project]
name = "agent-chat-simulator"
version = "0.1.0"
description = "Standalone collaboration channel for testing agents."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.162.0,<0.163",
  "uvicorn>=0.54.0,<0.55",
  "websockets>=15.0.1,<16",
  "sqlalchemy>=2.1.6,<2.2",
  "pyjwt[crypto]>=2.15.1,<2.16",
  "httpx>=0.28.1,<0.29",
  "python-multipart>=0.0.32,<0.1",
  "microsoft-agents-activity==1.1.0",
  "azure-identity==1.25.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pip-audit>=2.10.1,<3",
    "playwright==1.64.1",
]

[[tool.uv.index]]
name = "microsoft-approved"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
