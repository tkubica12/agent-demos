[project]
name = "private-incidents-mcp"
version = "0.1.0"
description = "Mock private FSI incidents MCP server for OpenClaw VNet demos."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp",
    "PyJWT",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["private_incidents_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "protected-pypi"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
