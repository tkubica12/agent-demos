[model]
base_url = "https://autopilots-ehvw.cognitiveservices.azure.com/openai/v1/"
deployment = "gpt-6-1-sol"
expected_model = "gpt-6.1-sol"
version = "2026-09-29"
scope = "https://cognitiveservices.azure.com/.default"
reasoning_effort = "low"
max_output_tokens = 6000

[webiq]
url = "https://api.microsoft.ai/v3/mcp"
key_environment = "WEBIQ_API_KEY"
max_results = 4
max_passage_chars = 2400
estimated_usd_per_call = 0.007
max_calls = 10000

[limits]
max_runs = 240
max_estimated_usd = 200
reserve_usd = 20
max_tool_calls = 18
max_model_calls = 24
run_timeout_seconds = 360
max_searches = 6
max_source_reads = 5
max_report_words = 650

[benchmark]
repetitions = 3
seed = 20261022
source_cutoff = "2026-10-22"

[pricing]
input_per_million = 2.0
cached_input_per_million = 0.10
cache_write_per_million = 2.50
output_per_million = 10.0
source = "https://azure.microsoft.com/en-us/pricing/details/azure-openai/"
verified_date = "2026-10-22"
conditions = "Global Standard, short context, standard service tier; estimated retail, not invoice."
