[project]
name = "agent-harness-comparison"
version = "0.1.0"
description = "Four native agent harnesses in one measured research application."
requires-python = ">=3.12,<3.14"
dependencies = [
    "agent-framework-core==1.21.0",
    "agent-framework-openai==1.16.0",
    "azure-identity==1.26.0",
    "deepagents==0.7.25",
    "github-copilot-sdk==1.0.22",
    "httpx>=0.28.1,<1",
    "langchain-openai==1.7.2",
    "mcp==1.30.0",
    "playwright==1.64.0",
]

[project.scripts]
harness-lab = "harness_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_lab"]

[[tool.uv.index]]
name = "protected-pypi"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true
