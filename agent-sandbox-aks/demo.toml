[azure]
location = "northeurope"
kubernetes_version = "1.36.3"
platform_size = "Standard_D4s_v3"
kata_size = "Standard_D4s_v3"
zone = "3"

[versions]
agent_sandbox = "v1.0.3"
agentgateway = "v1.5.0"

[limits]
cloud_usd = 200
model_requests = 0
vcpu = 20
sandboxes = 2
terraform_applies = 5
deployment_attempts = 20
repair_cycles = 6
execution_hours = 4
conservative_usd_per_hour = 6

[retention]
mode = "retain"
scheduled_destruction = false
