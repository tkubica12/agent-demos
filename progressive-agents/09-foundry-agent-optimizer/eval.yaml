name: step09-optimizer-training
agent:
  name: step-09-foundry-agent-optimizer
  kind: hosted
  model: gpt-5.4-mini
  config: .agent_configs/baseline/metadata.yaml
dataset:
  local_uri: datasets/optimizer-train.jsonl
evaluators:
  - builtin.task_adherence
  - name: step09-optimizer-training
    version: "1"
    local_uri: evaluators/step09-optimizer-training/rubric_dimensions.json
options:
  eval_model: gpt-5.4-mini
  optimization_model: gpt-5.4
  max_candidates: 2
  optimization_config:
    model_search_space:
      - gpt-5.4-nano
      - gpt-4.1
