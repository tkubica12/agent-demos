[project]
name = "private-bot-proxy"
version = "0.1.0"
description = "Falsifiable Azure Bot private-endpoint ingress experiment for Microsoft Teams."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiohttp==3.13.2",
    "httpx==0.28.1",
    "microsoft-agents-authentication-msal==1.4.0",
    "microsoft-agents-hosting-fastapi==1.4.0",
    "pydantic-settings==2.10.1",
    "pyjwt==2.10.1",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "jsonschema==4.25.1",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.9",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
