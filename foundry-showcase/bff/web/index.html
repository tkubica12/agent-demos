<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foundry Showcase</title>
    <script src="/vendor/msal-browser.min.js"></script>
    <style>
      :root { color-scheme: light dark; font-family: "Segoe UI", sans-serif; }
      body { margin: 0; background: #f5f5f5; color: #242424; }
      main { width: min(880px, calc(100vw - 32px)); margin: 24px auto; }
      header, #chat, form, #status { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
      h1 { margin: 0 0 6px; font-size: 1.3rem; }
      p { margin: 0; color: #666; }
      #chat { min-height: 360px; }
      .message { max-width: 78%; padding: 10px 12px; margin: 8px 0; border-radius: 10px; background: #eee; white-space: pre-wrap; }
      .user { margin-left: auto; background: #dcecff; }
      .feedback { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; max-width: 78%; }
      .feedback button { padding: 4px 10px; font-size: .95rem; background: #eee; color: #242424; border: 1px solid #ccc; cursor: pointer; }
      .feedback button.active { background: #0078d4; color: white; border-color: #0078d4; }
      .feedback input { flex: 1; min-width: 0; padding: 6px 8px; font: inherit; border: 1px solid #ccc; border-radius: 6px; }
      .feedback .note { color: #666; font-size: .85rem; }
      form { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
      textarea { min-height: 54px; padding: 10px; font: inherit; }
      button { padding: 0 18px; border: 0; border-radius: 8px; background: #0078d4; color: white; font-weight: 600; }
      button:disabled { opacity: .6; }
      #status { color: #555; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Foundry support operations</h1>
        <p>Entra-authenticated AG-UI through a secretless managed-identity gateway.</p>
      </header>
      <section id="chat" aria-live="polite"></section>
      <form id="form">
        <textarea id="prompt" placeholder="Ask the support agent" required></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <div id="status">Preparing sign-in...</div>
    </main>
    <script type="module">
      const status = document.querySelector("#status");
      if (typeof msal === "undefined") {
        status.textContent = "Sign-in library failed to load. Reload the page.";
        throw new Error("msal-browser is not available");
      }
      const config = await fetch("/config").then((response) => response.json());
      const msalClient = new msal.PublicClientApplication({
        auth: {
          clientId: config.clientId,
          authority: `https://login.microsoftonline.com/${config.tenantId}`,
          redirectUri: window.location.origin,
        },
        cache: { cacheLocation: "sessionStorage" },
      });
      await msalClient.initialize();

      function describe(error) {
        return error.errorCode || error.errorMessage || error.message || String(error);
      }

      async function signIn() {
        const cached = msalClient.getAllAccounts()[0];
        if (cached) {
          try {
            const silent = await msalClient.acquireTokenSilent({
              account: cached,
              scopes: [config.scope],
            });
            return silent.account;
          } catch (error) {
            status.textContent = `Session expired (${describe(error)}). Sign in again.`;
          }
        }
        return new Promise((resolve) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "Sign in";
          status.textContent = "Sign in to start. A Microsoft window will open. ";
          status.appendChild(button);
          button.addEventListener("click", async () => {
            button.disabled = true;
            try {
              const login = await msalClient.loginPopup({ scopes: [config.scope] });
              resolve(login.account);
            } catch (error) {
              button.disabled = false;
              status.textContent = `Sign-in failed: ${describe(error)}. Allow pop-ups, then retry. `;
              status.appendChild(button);
            }
          });
        });
      }

      const account = await signIn();
      const messages = [];
      const threadId = crypto.randomUUID();
      status.textContent = `Signed in as ${account.username}`;

      function bubble(role, text) {
        const element = document.createElement("div");
        element.className = `message ${role}`;
        element.textContent = text;
        document.querySelector("#chat").appendChild(element);
        return element;
      }

      function feedbackBar(traceId, spanId) {
        const bar = document.createElement("div");
        bar.className = "feedback";
        bar.innerHTML = `
          <button type="button" data-vote="up" title="This answer was helpful">&#128077;</button>
          <button type="button" data-vote="down" title="This answer was not helpful">&#128078;</button>
          <input type="text" placeholder="Add a comment (optional)" />
          <span class="note"></span>`;
        const note = bar.querySelector(".note");
        const comment = bar.querySelector("input");

        bar.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", async () => {
            const passed = button.dataset.vote === "up";
            note.textContent = "Sending...";
            try {
              const auth = await msalClient.acquireTokenSilent({ account, scopes: [config.scope] });
              const response = await fetch("/feedback", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${auth.accessToken}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ traceId, spanId, passed, comment: comment.value }),
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              bar.querySelectorAll("button").forEach((other) => other.classList.remove("active"));
              button.classList.add("active");
              note.textContent = "Thanks, recorded on this trace.";
            } catch (error) {
              note.textContent = `Could not send feedback: ${error.message}`;
            }
          });
        });

        document.querySelector("#chat").appendChild(bar);
      }

      document.querySelector("#form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const prompt = document.querySelector("#prompt");
        const send = document.querySelector("#send");
        const content = prompt.value.trim();
        if (!content) return;
        prompt.value = "";
        send.disabled = true;
        bubble("user", content);
        messages.push({ id: crypto.randomUUID(), role: "user", content });
        const assistant = bubble("assistant", "");
        try {
          const auth = await msalClient.acquireTokenSilent({ account, scopes: [config.scope] });
          const response = await fetch("/agui", {
            method: "POST",
            headers: {
              Accept: "text/event-stream",
              Authorization: `Bearer ${auth.accessToken}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              threadId,
              runId: crypto.randomUUID(),
              messages,
            }),
          });
          if (!response.ok || !response.body) throw new Error(`HTTP ${response.status}`);
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let text = "";
          let traceId = "";
          let spanId = "";
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop() || "";
            for (const line of lines) {
              if (!line.startsWith("data:")) continue;
              const item = JSON.parse(line.slice(5).trim());
              if (item.type === "TEXT_MESSAGE_CONTENT") {
                text += item.delta || "";
                assistant.textContent = text;
              }
              if (item.type === "RUN_FINISHED") {
                traceId = item.traceId || "";
                spanId = item.spanId || "";
              }
              if (item.type === "RUN_ERROR") throw new Error(item.message);
            }
          }
          messages.push({ id: crypto.randomUUID(), role: "assistant", content: text });
          if (traceId && spanId) feedbackBar(traceId, spanId);
        } catch (error) {
          assistant.textContent = `Error: ${error.message}`;
        } finally {
          send.disabled = false;
        }
      });
    </script>
  </body>
</html>
