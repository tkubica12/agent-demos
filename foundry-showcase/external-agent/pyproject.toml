[project]
name = "foundry-showcase-external-agent"
version = "0.1.0"
description = "A2A support triage assistant running outside Foundry, for Control Plane registration."
requires-python = ">=3.11,<3.14"
dependencies = [
    "azure-identity>=1.25.0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b0",
    "fastapi>=0.115.0",
    "openai>=1.90.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-sdk>=1.30.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["external_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
