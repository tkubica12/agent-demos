# Shot list for the Foundry showcase demo guide.
#
# Numbering follows the article's chapter order. Sign in once with
# `uv run python capture.py --login`, then `uv run python capture.py`.
#
# The viewport must stay wider than about 2.3:1. Slides mode scales a card with
# CSS `zoom`, which has no effect on an image sized at 100% width, so a figure
# has to fit the slide on its own height.

[portal]
host = "https://ai.azure.com"
workspace_key = "ZzrzTWsoQdy8e_UHQYBF5g,ai-services,,tomaskubica-foundry-resource,tomaskubica-foundry-project"
tenant_id = "6ce4f237-667f-43f5-aafd-cbef954adf97"
account_hint = "tomas@tomasonline.net"
login_url = "/build/evaluations/list"
ready_text = "Evaluations"
width = 1920
height = 840
settle_ms = 10000

# --- 1. Resource and project ---

[[shot]]
id = "01-project-home"
url = "/home"

# --- 2. Deployments: many vendors, one endpoint ---

[[shot]]
id = "02-deployments"
url = "/build/models/deployments"

[[shot]]
id = "03-fine-tune"
