name: foundry-showcase-phase5
agent:
    name: foundry-showcase-main
    kind: hosted
    version: "38"
    model: gpt-6.1-sol
    config: .agent_configs\baseline\metadata.yaml
    model_search_space:
        - gpt-6.1-sol
        - gpt-6-luna
dataset:
    local_uri: datasets\foundry-showcase-phase5\foundry-showcase-phase5_dg.jsonl
evaluators:
    - builtin.task_adherence
    - builtin.intent_resolution
    - name: foundry-showcase-phase5
      version: "4"
      local_uri: evaluators\foundry-showcase-phase5\rubric_dimensions.json
options:
    eval_model: gpt-6.1-sol
max_samples: 40
