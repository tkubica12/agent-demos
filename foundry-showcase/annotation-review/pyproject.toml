[project]
name = "foundry-showcase-annotation-review"
version = "0.1.0"
description = "Business-facing reviewer app that annotates Foundry agent traces outside the Foundry portal."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "msal>=1.31",
    "itsdangerous>=2.2",
    "azure-identity>=1.25",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
